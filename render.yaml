# Render blueprint: the relayer and the agent as ONE always-on service.
#
# The website (landing page and the app at /app) is hosted on Vercel. It proxies two prefixes to this service:
#
#   https://<site>/relayer/*  ->  https://<this service>/*
#   https://<site>/agent/*    ->  https://<this service>/agent/*
#
# scripts/serve.mjs starts both servers and routes by path behind the single port Render gives a service.
#
# Use a paid plan. A free service goes to sleep after a quiet spell, and a sleeping service has no keeper, so
# an unanswered hold would not expire and the weekly allowance would not run.
#
# Every value marked `sync: false` is entered in the Render dashboard (or pasted from `.render.env`, which
# `node scripts/render-env.mjs` writes locally and git ignores). None of them are in the repository.
# Do NOT enter DEPLOYER_PRIVATE_KEY here: the service never needs it.
services:
  - type: web
    name: companion-api
    runtime: node
    plan: starter
    buildCommand: corepack enable && pnpm install --frozen-lockfile --filter @thunai/relayer... --filter @thunai/agent...
    startCommand: node scripts/serve.mjs
    healthCheckPath: /health
    # Family display names, push subscriptions and the traction cache live in DATA_DIR. The chain is the record of
    # money and identity, so losing the disk would not lose funds, but a family would have to be recreated.
    disk:
      name: companion-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATA_DIR
        value: /var/data
      - key: LOG_LEVEL
        value: info
      - key: TESTNET_PARTNER_STANDIN
        value: "true"
      - key: KEEPER_ENABLED
        value: "true"
      - key: CORS_ORIGIN
        sync: false # the site's origin, for example https://companion-family.vercel.app
      - key: APP_URL
        sync: false # https://<the site>/app , used in alert and invite links
      - key: MONAD_RPC_URL
        sync: false
      - key: LOGS_RPC_URL
        value: https://testnet-rpc.monad.xyz
      - key: THUNAI_START_BLOCK
        value: 70125515
      - key: RELAYER_PRIVATE_KEY
        sync: false
      - key: AGENT_PRIVATE_KEY
        sync: false
      - key: DEV_ADMIN_TOKEN
        sync: false
      - key: INTERNAL_TOKEN
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLASSIFIER_MODEL
        sync: false
      # Chainlink CRE (see cre/README.md). Leave ORCHESTRATOR as keeper until a CRE simulation has passed.
      - key: ORCHESTRATOR
        value: keeper
      - key: CRE_TOKEN
        sync: false
