# Render blueprint: the relayer and the agent as ONE always-on service.
#
# The website (landing page and the app at /app) is hosted on Vercel. It proxies two prefixes to this service:
#
#   https://<site>/relayer/*  ->  https://<this service>/*
#   https://<site>/agent/*    ->  https://<this service>/agent/*
#
# scripts/serve.mjs starts both servers and routes by path behind the single port Render gives a service.
#
# FREE plan. A free web service sleeps after 15 minutes without inbound traffic, and a sleeping service has no keeper,
# so an unanswered hold would not expire and the weekly allowance would not run. Keep it awake with a free pinger that
# requests https://companion-api-27cv.onrender.com/health every 5 minutes (UptimeRobot or cron-job.org). One free service has
# enough monthly hours (750) to stay up all month. docs/DEPLOY.md has the steps.
#
# A free service has no persistent disk, so DATA_DIR is temporary and is wiped on every restart or redeploy. The chain keeps
# the money, the passkeys, the envelope and the notes; what is lost is only display names, masked contacts, push
# subscriptions and invites not yet accepted. Do not redeploy in the middle of a demo.
#
# Every value marked `sync: false` is entered in the Render dashboard (or pasted from `.render.env`, which
# `node scripts/render-env.mjs` writes locally and git ignores). None of them are in the repository.
# Do NOT enter DEPLOYER_PRIVATE_KEY here: the service never needs it.
services:
  - type: web
    name: companion-api
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile --filter @thunai/relayer... --filter @thunai/agent...
    startCommand: node scripts/serve.mjs
    healthCheckPath: /health
    # Redeploy only when the service itself changes. A push of docs, the website or the app would otherwise restart it and
    # wipe the temporary store (names, invites, push subscriptions), for nothing.
    buildFilter:
      paths:
        - relayer/**
        - agent/**
        - packages/**
        - contracts/deployments/**
        - scripts/serve.mjs
        - render.yaml
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATA_DIR
        value: /tmp/companion-data
      - key: LOG_LEVEL
        value: info
      - key: TESTNET_PARTNER_STANDIN
        value: "true"
      - key: KEEPER_ENABLED
        value: "true"
      - key: CORS_ORIGIN
        sync: false # the site's origin, for example https://companion-family.vercel.app
      - key: APP_URL
        sync: false # https://<the site>/app , used in alert and invite links
      - key: MONAD_RPC_URL
        sync: false
      - key: LOGS_RPC_URL
        value: https://testnet-rpc.monad.xyz
      # The Agora-ready vault: real CTK and AUSD, Agora Instant Settlement on (contracts/deployments/10143.agora.json).
      - key: THUNAI_DEPLOYMENT
        value: agora
      - key: THUNAI_START_BLOCK
        value: 70125617
      - key: RELAYER_PRIVATE_KEY
        sync: false
      - key: AGENT_PRIVATE_KEY
        sync: false
      - key: DEV_ADMIN_TOKEN
        sync: false
      - key: INTERNAL_TOKEN
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLASSIFIER_MODEL
        sync: false
      # Chainlink CRE (see cre/README.md). Leave ORCHESTRATOR as keeper until a CRE simulation has passed.
      - key: ORCHESTRATOR
        value: keeper
      - key: CRE_TOKEN
        sync: false
