[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = [
    "solady/=lib/solady/src/",
    "forge-std/=lib/forge-std/src/",
]
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[rpc_endpoints]
monad_testnet = "${MONAD_RPC_URL}"

[fmt]
line_length = 120
